name: Deploy Ugur Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract latest Ugur archive
        shell: bash
        run: |
          set -e

          ARCHIVE="$(find . -maxdepth 1 -type f -iname 'ugur_flutter*.zip' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"

          if [ -z "$ARCHIVE" ]; then
            ARCHIVE="$(find . -maxdepth 1 -type f -iname '*.zip' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          fi

          if [ -z "$ARCHIVE" ]; then
            echo "ZIP archive not found"
            exit 1
          fi

          echo "Using archive: $ARCHIVE"

          rm -rf extracted ugur_app
          mkdir -p extracted ugur_app

          unzip -q "$ARCHIVE" -d extracted

          PROJECT_DIR="$(find extracted -type f -name pubspec.yaml -printf '%h\n' | head -n 1)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "Flutter project not found inside archive"
            exit 1
          fi

          cp -a "$PROJECT_DIR"/. ugur_app/

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Flutter Web
        working-directory: ugur_app
        run: |
          flutter config --enable-web
          flutter create . --platforms=web
          flutter pub get

      - name: Build Web
        working-directory: ugur_app
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Web version
        uses: actions/upload-pages-artifact@v3
        with:
          path: ugur_app/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
