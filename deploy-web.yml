name: Deploy Ugur Web

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ugur-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate clean Flutter project
        run: python3 tool/validate_project.py

      - name: Create web platform
        run: flutter create --platforms=web --org tm.ugur --project-name ugur .

      - name: Normalize iOS browser and Home Screen viewport
        run: python3 tool/patch_web_pwa.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build web without legacy PWA cache
        shell: bash
        run: |
          REPOSITORY_NAME="${GITHUB_REPOSITORY#*/}"
          BASE_HREF="/${REPOSITORY_NAME}/"
          echo "Building GitHub Pages bundle with base href: ${BASE_HREF}"

          if flutter build web --help | grep -q -- '--pwa-strategy'; then
            flutter build web --release --base-href "${BASE_HREF}" --pwa-strategy=none
          else
            flutter build web --release --base-href "${BASE_HREF}"
          fi

      - name: Finalize Pages bundle
        run: python3 tool/postprocess_web.py build/web

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
